# nginx.conf cho frontend SmartHome (Phase 6)
# Proxy /api/ và /ws tới backend container; phục vụ static file từ Vite build.
# File này được COPY vào image nginx ở Dockerfile.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: mọi route trả về index.html (React Router tự xử lý)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy REST API tới backend (bỏ trailing slash để giữ nguyên path)
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy WebSocket STOMP tới backend (upgrade HTTP → WS)
    location /ws {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Giữ kết nối WS lâu (86400s = 24h); frontend sẽ tự reconnect nếu mất
        proxy_read_timeout 86400;
    }

    # Proxy Swagger UI (tiện cho demo / kiểm thử)
    location /swagger-ui/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }
    location /v3/api-docs {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }
}
