# =============================================================================
# Cấu hình docker-java cho test tích hợp (Testcontainers).
#
# Docker Desktop 29.2.1+ đã bỏ hỗ trợ các API version cũ (tối thiểu 1.44), trong khi
# docker-java mặc định gọi API 1.32 -> daemon trả "400 Bad Request" và Testcontainers
# báo "Could not find a valid Docker environment". Ghim đúng API version daemon hỗ trợ.
# =============================================================================
api.version=1.44
